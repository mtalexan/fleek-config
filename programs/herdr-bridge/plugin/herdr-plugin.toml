id = "herdr-bridge"
name = "herdr bridge"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Open a pane's workspace in an editor on the machine viewing the session"
platforms = ["linux"]

[[actions]]
id = "edit"
title = "Open workspace in default editor"
description = "Opens the focused pane's directory in the default editor on the viewing herdr client."
contexts = ["pane"]
platforms = ["linux"]
command = ["bash", "edit.sh"]

[[actions]]
id = "edit-alt"
title = "Open workspace in alt editor"
description = "Opens the focused pane's directory in the alt editor on the viewing herdr client."
contexts = ["pane"]
platforms = ["linux"]
command = ["bash", "edit.sh", "alt"]
